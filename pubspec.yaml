name: meetmind_ai
description: "MeetMind AI — AI-powered meeting notes & smart task management."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  pretty_dio_logger: ^1.4.0

  # Local storage / offline-first (ARCHITECTURE.md 2.3)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Auth token storage
  flutter_secure_storage: ^9.2.2

  # Auth
  # NOTE: v7 rewrote the API (GoogleSignIn.instance singleton + initialize()
  # + authenticate(), authorization split into a separate authorizationClient).
  # See lib/features/auth/data/datasources/google_auth_data_source.dart.
  google_sign_in: ^7.2.0

  # Profile avatar upload — SRD FR-14.1
  image_picker: ^1.1.2

  # Firebase (push notifications) — SRD.md 2.3
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # Audio recording pipeline — ARCHITECTURE.md 2.4
  # NOTE: pin to the 6.x line, not 5.x or 7.x:
  #  - 5.x has a known upstream version-skew bug (record_linux 0.7.2 doesn't
  #    implement newer record_platform_interface methods like startStream),
  #    which fails the build on ALL platforms, not just the mismatched one.
  #  - 7.x requires Dart SDK >=3.12, which is newer than many current stable
  #    Flutter installs ship. If `flutter --version` reports Dart >=3.12,
  #    you can bump this to ^7.1.1 instead.
  # 6.x already has the post-rename AudioRecorder API and needs only Dart >=3.5.
  record: ^6.2.1
  just_audio: ^0.9.40
  audio_waveforms: ^1.1.0

  # UI / theming (Material 3 + Design.md)
  google_fonts: ^6.3.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0 # skeleton loaders (DESIGN.md 4)

  # Charts (Analytics screen — DESIGN.md 3.11)
  fl_chart: ^0.68.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.4.0
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  drift_dev: ^2.19.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
